[[bench]]
name = "j2k_compression"
path = "benches/j2k_compression.rs"
harness = false

[[bench]]
name = "interop_benchmarks"
path = "benches/interop_benchmarks.rs"
harness = false

[lib]
name = "jpegexp_rs"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
num_enum = "0.7.5"
thiserror = "2.0.17"
clap = { version = "4.4", features = ["derive"] }

[dev-dependencies]
criterion = "0.8.1"
hex = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[features]
default = []
wasm = []
ffi = []

[profile.dev]
# Optimized debug profile - faster builds with debug info
opt-level = 0
debug = true
# split-debuginfo = "packed"  # Windows: use "unpacked" or omit (packed is macOS-specific)

[profile.dev.package."*"]
# Optimize dependencies in dev mode for faster iteration
opt-level = 3

[profile.test]
# Test profile - slightly optimized for faster test execution
opt-level = 1
debug = true
